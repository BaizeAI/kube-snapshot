{{- if .Values.runner.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "snapshot-pod.fullname" . }}-runner
  labels:
    {{- include "snapshot-pod.labels" . | nindent 4 }}
    {{- with .Values.runner.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  namespace: {{ .Release.Namespace | quote }}
spec:
  endpoints:
  - bearerTokenSecret:
      key: ""
    interval: {{ .Values.runner.serviceMonitor.interval | default "15s" }}
    {{- if .Values.runner.serviceMonitor.metricRelabelings }}
    metricRelabelings:
    {{- toYaml .Values.runner.serviceMonitor.metricRelabelings | nindent 4 }}
    {{- end }}
    path: {{ .Values.runner.serviceMonitor.path | default "/metrics" }}
    port: {{ .Values.runner.serviceMonitor.port | default "health" }}
    {{- if .Values.runner.serviceMonitor.relabelings }}
    relabelings:
    {{- toYaml .Values.runner.serviceMonitor.relabelings | nindent 4 }}
    {{- end }}
  jobLabel: {{ .Values.runner.serviceMonitor.jobLabel | default "app" }}
  namespaceSelector:
    matchNames:
    - {{ .Release.Namespace | quote }}
  selector:
    matchLabels:
      app: {{ include "snapshot-pod.fullname" . }}-runner
{{- end }}
