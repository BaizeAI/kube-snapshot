version: "2"
run:
  build-tags:
    - integ
    - integfuzz
linters:
  default: none
  enable:
    - errcheck
    - gocritic
    - govet
    - ineffassign
    - lll
    - misspell
    - staticcheck
    - unconvert
    - unparam
  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false
    gocritic:
      enabled-checks:
        - appendCombine
        - boolExprSimplify
        - builtinShadow
        - commentedOutCode
        - commentedOutImport
        - docStub
        - emptyFallthrough
        - equalFold
        - hexLiteral
        - indexAlloc
        - initClause
        - methodExprCall
        - nilValReturn
        - octalLiteral
        - rangeExprCopy
        - stringXbytes
        - typeAssertChain
        - typeUnparen
        - unnecessaryBlock
        - weakCond
    lll:
      line-length: 160
      tab-width: 1
    misspell:
      locale: US
      ignore-rules:
        - cancelled
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
        path: _test\.go$|^tests/|^samples/
      - linters:
          - staticcheck
        text: 'SA1019: package github.com/golang/protobuf'
      - path: (.+)\.go$
        text: composite literal uses unkeyed fields
    paths:
      - .*\.pb\.go
      - .*\.gen\.go
      - vendor$
      - genfiles$
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/baizeai/kube-snapshot
  exclusions:
    generated: lax
    paths:
      - .*\.pb\.go
      - .*\.gen\.go
      - vendor$
      - genfiles$
      - third_party$
      - builtin$
      - examples$
